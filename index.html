<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Particle Image & Text Assembly</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow: hidden;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Modal Overlay Styling */
        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .modal-card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(12px);
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 90%;
            width: 360px;
        }

        .modal-card h2 {
            font-size: 1.6rem;
            margin-bottom: 24px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 16px;
        }

        .btn {
            padding: 10px 28px;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .btn-yes {
            background-color: #e91e63;
            color: #ffffff;
        }

        .btn-yes:hover {
            background-color: #d81b60;
            transform: scale(1.05);
        }

        .btn-no {
            background-color: rgba(255, 255, 255, 0.15);
            color: #ffffff;
            position: relative;
        }

        .btn-no:hover {
            background-color: rgba(255, 255, 255, 0.25);
        }

        .hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <!-- Prompt Modal -->
    <div id="modal-overlay">
        <div class="modal-card">
            <h2>Do you like me? ❤️</h2>
            <div class="btn-group">
                <button class="btn btn-yes" id="yesBtn">Yes</button>
                <button class="btn btn-no" id="noBtn">No</button>
            </div>
        </div>
    </div>

    <!-- Removed "loop" attribute so it only plays once -->
    <audio id="bgMusic">
        <source src="https://github.com/abuhuria/Code/raw/refs/heads/main/Saiyaara_Reprise_Version_Ringtone___Shreya_Ghoshal___Ahaan_Panday,_Aneet_Padda___Saiyaara_Ringtone(256k).mp3" type="audio/mpeg">
    </audio>

    <div id="canvas-container"></div>

    <script>
        // --- 0. UI Modal & Audio Controls ---
        const modalOverlay = document.getElementById('modal-overlay');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const bgMusic = document.getElementById("bgMusic");

        let animationStarted = false;

        yesBtn.addEventListener('click', () => {
            modalOverlay.classList.add('hidden');
            bgMusic.play().catch(() => {});
            if (!animationStarted) {
                animationStarted = true;
                initThreeJS();
            }
        });

        // playful response if "No" is clicked (moves button away)
        noBtn.addEventListener('mouseover', () => {
            const x = (Math.random() - 0.5) * 200;
            const y = (Math.random() - 0.5) * 100;
            noBtn.style.transform = `translate(${x}px, ${y}px)`;
        });

        // --- ১. আপনার নতুন ছবির লিংক ---
        const IMAGE_URL = 'https://raw.githubusercontent.com/abuhuria/Song/refs/heads/main/FB_IMG_1785688637177.jpg';

        function initThreeJS() {
            // --- ২. THREE.JS প্রাথমিক সেটআপ ---
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();

            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            function adjustCameraPosition() {
                const width = window.innerWidth;
                if (width < 480) {
                    camera.position.z = 280;
                } else if (width < 768) {
                    camera.position.z = 230;
                } else {
                    camera.position.z = 180;
                }
            }
            adjustCameraPosition();

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // --- ২.১. ব্যাকগ্রাউন্ড স্কাই/তারা (Starfield) তৈরি ---
            let starField = null;
            function createStarfield() {
                const starCount = 2000;
                const starGeometry = new THREE.BufferGeometry();
                const starPositions = new Float32Array(starCount * 3);

                for (let i = 0; i < starCount; i++) {
                    const i3 = i * 3;
                    starPositions[i3] = (Math.random() - 0.5) * 1200;
                    starPositions[i3 + 1] = (Math.random() - 0.5) * 1200;
                    starPositions[i3 + 2] = (Math.random() - 0.5) * 1200;
                }

                starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
                
                const starMaterial = new THREE.PointsMaterial({
                    color: 0xffffff,
                    size: 1.7,
                    transparent: true,
                    opacity: 0.8
                });

                starField = new THREE.Points(starGeometry, starMaterial);
                scene.add(starField);
            }
            createStarfield();

            let particleSystem = null;
            let particleData = [];
            let state = 0; // 0: Floating Up, 1: Hold Image, 2: Morph to Text, 3: Completed
            let stateTimer = 0;

            // --- ৩. "Best gift for me ❤️" টেক্সটের জন্য পজিশন জেনারেট করা ---
            function createTextPositions(count, text) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 600;
                canvas.height = 150;

                ctx.fillStyle = '#ffffff';
                ctx.font = 'Bold 42px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, canvas.width / 2, canvas.height / 2);

                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                const textPixels = [];

                for (let y = 0; y < canvas.height; y += 2) {
                    for (let x = 0; x < canvas.width; x += 2) {
                        const alpha = imgData[(y * canvas.width + x) * 4 + 3];
                        if (alpha > 128) {
                            textPixels.push({
                                x: (x - canvas.width / 2) * 0.45,
                                y: -(y - canvas.height / 2) * 0.45
                            });
                        }
                    }
                }

                const textPositions = [];
                for (let i = 0; i < count; i++) {
                    const pt = textPixels[i % textPixels.length];
                    textPositions.push(
                        pt.x + (Math.random() - 0.5) * 0.8,
                        pt.y + (Math.random() - 0.5) * 0.8,
                        (Math.random() - 0.5) * 2
                    );
                }
                return textPositions;
            }

            // --- ৪. পার্টিকল তৈরি লজিক ---
            function createParticleSystemFromImage(image) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                
                const maxDimension = 550; 
                let width = image.width;
                let height = image.height;

                if (width > maxDimension || height > maxDimension) {
                    if (width > height) {
                        height = Math.round((height * maxDimension) / width);
                        width = maxDimension;
                    } else {
                        width = Math.round((width * maxDimension) / height);
                        height = maxDimension;
                    }
                }

                canvas.width = width;
                canvas.height = height;
                ctx.drawImage(image, 0, 0, width, height);

                const imgData = ctx.getImageData(0, 0, width, height).data;

                const imagePositions = [];
                const initialPositions = [];
                const colors = [];

                for (let y = 0; y < height; y++) {
                    for (let x = 0; x < width; x++) {
                        const index = (y * width + x) * 4;
                        const rVal = imgData[index];
                        const gVal = imgData[index + 1];
                        const bVal = imgData[index + 2];
                        const alpha = imgData[index + 3];

                        if (alpha > 20) { 
                            const targetX = (x - width / 2) * 0.60;
                            const targetY = -(y - height / 2) * 0.60;
                            const targetZ = (Math.random() - 0.5) * 3;

                            const startX = targetX + (Math.random() - 0.5) * 120;
                            const startY = targetY - 300 - Math.random() * 150;
                            const startZ = targetZ + (Math.random() - 0.5) * 120;

                            initialPositions.push(startX, startY, startZ);
                            imagePositions.push(targetX, targetY, targetZ);

                            colors.push(rVal / 255, gVal / 255, bVal / 255);

                            particleData.push({
                                progress: 0,
                                delay: Math.random() * 0.4,
                                wobbleOffset: Math.random() * Math.PI * 2
                            });
                        }
                    }
                }

                const count = imagePositions.length / 3;
                const textPositions = createTextPositions(count, "stay forever ❣️");

                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(initialPositions, 3));
                geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

                geometry.userData = {
                    initialPositions: initialPositions,
                    imagePositions: imagePositions,
                    textPositions: textPositions
                };

                const material = new THREE.PointsMaterial({
                    size: 1.3,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.95
                });

                particleSystem = new THREE.Points(geometry, material);
                scene.add(particleSystem);
            }

            // --- ৫. ছবি লোড ---
            function loadImage(src) {
                const img = new Image();
                img.crossOrigin = "Anonymous";
                img.onload = () => createParticleSystemFromImage(img);
                img.src = src;
            }

            loadImage(IMAGE_URL);

            // --- ৬. অ্যানিমেশন লুপ ---
            let lastTime = Date.now();

            function animate() {
                requestAnimationFrame(animate);
                controls.update();

                const now = Date.now();
                const delta = (now - lastTime) * 0.001;
                lastTime = now;

                if (starField) {
                    starField.rotation.y += 0.0002;
                    starField.rotation.x += 0.0001;
                }

                if (particleSystem) {
                    const attr = particleSystem.geometry.attributes.position;
                    const positions = attr.array;
                    const uData = particleSystem.geometry.userData;

                    const startPos = uData.initialPositions;
                    const imgPos = uData.imagePositions;
                    const txtPos = uData.textPositions;

                    let allDone = true;

                    if (state === 0) {
                        for (let i = 0; i < particleData.length; i++) {
                            const i3 = i * 3;
                            const p = particleData[i];

                            p.progress += delta * 0.05; 
                            let effProgress = Math.max(0, (p.progress - p.delay) / (1 - p.delay));
                            effProgress = Math.min(1, effProgress);

                            const ease = 1 - Math.pow(1 - effProgress, 3);

                            if (effProgress < 1) {
                                allDone = false;
                                const wobble = Math.sin(now * 0.002 + p.wobbleOffset) * (1 - ease) * 3;
                                positions[i3] = startPos[i3] + (imgPos[i3] - startPos[i3]) * ease + wobble;
                                positions[i3 + 1] = startPos[i3 + 1] + (imgPos[i3 + 1] - startPos[i3 + 1]) * ease;
                                positions[i3 + 2] = startPos[i3 + 2] + (imgPos[i3 + 2] - startPos[i3 + 2]) * ease;
                            } else {
                                positions[i3] = imgPos[i3];
                                positions[i3 + 1] = imgPos[i3 + 1];
                                positions[i3 + 2] = imgPos[i3 + 2];
                            }
                        }

                        if (allDone) {
                            state = 1;
                            stateTimer = now;
                        }
                    } 
                    else if (state === 1) {
                        if (now - stateTimer > 20000) {
                            state = 2;
                            particleData.forEach(p => p.progress = 0);
                        }
                    } 
                    else if (state === 2) {
                        for (let i = 0; i < particleData.length; i++) {
                            const i3 = i * 3;
                            const p = particleData[i];

                            p.progress += delta * 0.35; 
                            let effProgress = Math.min(1, p.progress);
                            const ease = effProgress * effProgress * (3 - 2 * effProgress);

                            if (effProgress < 1) {
                                allDone = false;
                                const scatterX = (Math.random() - 0.5) * (1 - ease) * 12;
                                const scatterY = (Math.random() - 0.5) * (1 - ease) * 12;

                                positions[i3] = imgPos[i3] + (txtPos[i3] - imgPos[i3]) * ease + scatterX;
                                positions[i3 + 1] = imgPos[i3 + 1] + (txtPos[i3 + 1] - imgPos[i3 + 1]) * ease + scatterY;
                                positions[i3 + 2] = imgPos[i3 + 2] + (txtPos[i3 + 2] - imgPos[i3 + 2]) * ease;
                            } else {
                                positions[i3] = txtPos[i3];
                                positions[i3 + 1] = txtPos[i3 + 1];
                                positions[i3 + 2] = txtPos[i3 + 2];
                            }
                        }

                        if (allDone) {
                            state = 3;
                        }
                    }

                    attr.needsUpdate = true;
                }

                renderer.render(scene, camera);
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                adjustCameraPosition();
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            animate();
        }
    </script>
</body>
</html>
